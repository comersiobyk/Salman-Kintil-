<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0715">
<title>Salman — Malam Tahun Baru</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap');
:root{
  --ink:#f4ecf5;
  --dim:#b9a8c4;
  --panel:#1a1225;
  --panel2:#241a33;
  --bg1:#0c0715;
  --bg2:#170e26;
  --gold:#e0b872;
  --rose:#d98aa0;
  --annoy:#c25b5b;
  --ok:#7fb88a;
  --line:rgba(224,184,114,0.18);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;}
html,body{
  height:100%;
  margin:0;
  overscroll-behavior:none;
  touch-action:manipulation;
}
body{
  font-family:'Manrope',sans-serif;
  background: #000;
  color:var(--ink);
  min-height:100%;
  min-height:100dvh;
  overflow:hidden;
  -webkit-user-select:none;
  user-select:none;
}
/* ambient stars */
.stars{position:fixed; inset:0; z-index:0; pointer-events:none;}
.stars span{
  position:absolute;
  width:2px; height:2px;
  background:var(--gold);
  border-radius:50%;
  opacity:.5;
  animation:tw 4s ease-in-out infinite;
}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.75}}

/* full-viewport "app" stage */
.stage{
  position:fixed;
  inset:0;
  z-index:1;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:linear-gradient(180deg, #150f21, #08040d);
  display:flex;
  flex-direction:column;
}

/* background layer */
.bg-layer{
  position:absolute;
  inset:0;
  z-index:0;
  background-image: var(--bg-url, none);
  background-size:cover;
  background-position:center;
  opacity:0;
  transition:opacity .6s ease;
}
.bg-layer.on{ opacity:1; }
.bg-scrim{
  position:absolute;
  inset:0;
  z-index:0;
  background: linear-gradient(180deg, rgba(8,4,14,.55) 0%, rgba(8,4,14,.15) 30%, rgba(8,4,14,.25) 65%, rgba(8,4,14,.85) 100%);
}

/* header */
.topbar{
  position:absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:calc(14px + var(--sat)) 20px 14px 20px;
  font-family:'Cormorant Garamond', serif;
  color:var(--dim);
  letter-spacing:.08em;
  font-size:13px;
  text-transform:uppercase;
  background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
}
.topbar .clock{color:var(--gold); font-weight:600;}
.topbar .right{display:flex; align-items:center; gap:10px;}
.mute-btn{
  width:26px; height:26px; border-radius:50%;
  border:1px solid var(--line);
  background:rgba(0,0,0,.3);
  color:var(--dim);
  font-size:12px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
.mood-track{
  height:3px; width:90px;
  background:rgba(255,255,255,.08);
  border-radius:3px; overflow:hidden;
}
.mood-fill{height:100%; width:50%; background:linear-gradient(90deg,var(--annoy),var(--gold),var(--rose)); transition:width .5s ease;}

/* FULLSCREEN SCENE & SPRITE */
.scene{
  position:absolute;
  inset:0; /* Fills the entire screen */
  z-index:1;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  overflow:hidden;
}
.sprite-wrap{
  position:relative;
  z-index:2;
  width: 100%;
  height: 100%; 
  display:flex;
  align-items:flex-end;
  justify-content:center;
  transition:transform .35s ease;
}

/* Removes empty spaces and makes character bleed off edges naturally */
.sprite, .sheet-sprite, .placeholder-sprite {
  height: 100vh; /* Force to take full height of screen */
  max-height: none;
  width: auto;
  min-width: 100%; /* Ensure it spans at least full width on mobile */
  aspect-ratio: var(--sw) / var(--sh);
  object-fit: cover;
  border-radius: 0; /* Remove rounded corners so it fits the screen edge */
  filter: drop-shadow(0 0 50px rgba(0,0,0,.9));
  transition: opacity .3s ease;
}
.sheet-sprite{
  background-image: var(--sheet-url);
  background-repeat:no-repeat;
  background-size: var(--bgw) var(--bgh);
  background-position: var(--bgx) var(--bgy);
}
.placeholder-sprite{
  background:linear-gradient(160deg, #3a2b4d, #241834);
  color:var(--dim); font-family:'Cormorant Garamond',serif;
  display:flex; align-items:center; justify-content:center; text-align:center;
}

.pose-tag{
  position:absolute;
  top:calc(50px + var(--sat));
  left:50%; transform:translateX(-50%);
  font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:rgba(224,184,114,0.4);
  z-index:3;
}

/* DIALOGUE BOX (Flush to bottom) */
.dialogue{
  position:absolute;
  bottom: 0;
  left: 0;
  right: 0;
  z-index:4;
  margin:0;
  background:linear-gradient(180deg, rgba(36,26,51,0.85), rgba(20,12,31,0.98));
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-top:1px solid var(--line);
  border-radius:24px 24px 0 0;
  padding:20px 20px calc(24px + var(--sab)) 20px;
  min-height:160px;
  box-shadow:0 -10px 40px rgba(0,0,0,.6);
}
.speaker{
  font-family:'Cormorant Garamond', serif;
  font-weight:600; font-size:22px;
  letter-spacing:.02em; margin-bottom:8px;
}
.speaker.kayla{color:var(--rose);}
.speaker.Salman Kintil{color:var(--gold);}
.speaker.narr{color:var(--dim); font-style:italic; font-weight:500;}
.line{
  font-size:15.5px;
  line-height:1.6;
  color:var(--ink);
  min-height:50px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.8);
}
.line .cursor{opacity:.6; animation:blink 1s step-start infinite;}
@keyframes blink{50%{opacity:0}}
.advance-hint{
  margin-top:12px; font-size:11px; color:var(--dim); text-align:right;
  letter-spacing:.06em; text-transform:uppercase; cursor:pointer; user-select:none;
}

/* choices */
.choices{
  display:flex; flex-direction:column; gap:10px; margin-top:16px;
}
.choice-btn{
  text-align:left;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--line);
  color:var(--ink);
  padding:12px 16px;
  border-radius:12px;
  font-family:'Manrope',sans-serif; font-size:14.5px;
  cursor:pointer; transition:all .18s ease;
}
.choice-btn:hover{
  background:rgba(224,184,114,0.12);
  border-color:var(--gold); transform:translateX(4px);
}
.choice-btn .tag{
  font-size:10px; color:var(--gold); letter-spacing:.1em;
  text-transform:uppercase; margin-right:8px; opacity:.85;
}

/* OVERLAYS */
.overlay{
  position:absolute; inset:0; z-index:20;
  background:linear-gradient(180deg, rgba(12,7,21,.9), rgba(12,7,21,.98));
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:30px; backdrop-filter:blur(4px);
}
.overlay h1{
  font-family:'Cormorant Garamond', serif; font-weight:600; font-size:42px;
  margin:0 0 8px 0; color:var(--gold); letter-spacing:.02em;
}
.overlay .sub{color:var(--dim); font-size:15px; margin-bottom:30px; max-width:400px; line-height:1.5;}
.btn{
  background:linear-gradient(180deg, var(--gold), #c99a54);
  color:#241804; border:none; padding:14px 34px; border-radius:30px;
  font-weight:700; font-size:15px; letter-spacing:.03em; cursor:pointer;
  box-shadow:0 8px 24px rgba(224,184,114,.3); transition:transform .15s ease;
}
.btn:hover{transform:translateY(-2px);}
.ending-badge{
  font-size:12px; letter-spacing:.15em; text-transform:uppercase;
  color:var(--rose); margin-bottom:14px; opacity:.9; font-weight:700;
}
.hidden{display:none !important;}
.audio-gate{
  position:fixed; inset:0; z-index:50; background:#050308;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:30px;
}
.audio-gate .tap-icon{
  width:64px; height:64px; border-radius:50%; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:24px; animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1); opacity:.7} 50%{transform:scale(1.08); opacity:1}}
@media (max-width:420px){
  .overlay h1{font-size:32px;}
}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="stage">
  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-scrim"></div>

  <div class="topbar">
    <span>Salman Kintil The Game</span>
    <div class="right">
      <span class="clock" id="clockText">23:41</span>
      <div class="mood-track"><div class="mood-fill" id="moodFill"></div></div>
      <div class="mute-btn" id="muteBtn" onclick="toggleMute()">♪</div>
    </div>
  </div>

  <div class="scene">
    <div class="sprite-wrap" id="spriteWrap">
      <div class="placeholder-sprite" id="spriteImg">Kayla<br>(berdiri_1)</div>

  </div>

  <div class="dialogue">
    <div class="speaker" id="speakerName"></div>

  <div class="audio-gate" id="audioGate">
    <div class="tap-icon">🔊</div>
    <div>
      <div style="font-family:'Cormorant Garamond',serif; font-size:22px; color:var(--gold); margin-bottom:6px;">Salman</div>
      <div style="color:var(--dim); font-size:13px;">Ketuk layar untuk memulai dengan suara</div>
    </div>
  </div>

  <div class="overlay hidden" id="startOverlay">
    <h1>Malam Tahun Baru</h1>
    <div class="sub">Di kamar Kayla, cuma berdua, satu jam sebelum pergantian tahun.<br>Tensi memanas. Pilih kata-katamu dengan bijak.</div>
    <button class="btn" onclick="startGame()">Mulai</button>

    <button class="btn" onclick="restartGame()">Main Lagi</button>
  </div>
</div>

<script>
const starsEl = document.getElementById('stars');
for(let i=0;i<50;i++){
  const s=document.createElement('span');
  s.style.left=Math.random()*100+'%';
  s.style.top=Math.random()*60+'%';
  s.style.animationDelay=(Math.random()*4)+'s';
  starsEl.appendChild(s);
}

(function loadBackground(){
  const candidates = ["background.jpg", "background.jpeg", "background.png", "background.webp"];
  const bgLayer = document.getElementById('bgLayer');
  let i = 0;
  (function tryNext(){
    if(i >= candidates.length) return;
    const path = candidates[i++];
    const img = new Image();
    img.onload = ()=>{
      bgLayer.style.setProperty('--bg-url', `url('${path}')`);
      bgLayer.classList.add('on');
    };
    img.onerror = tryNext;
    img.src = path;
  })();
})();

const backsound = new Audio('backsound.mp3'); backsound.loop = true; backsound.volume = 0.35;
const sfxNotif = new Audio('notification.mp3'); sfxNotif.volume = 0.6;
const sfxIntim = new Audio('ww.mp3'); sfxIntim.volume = 0.8;
let audioMuted = false, audioUnlocked = false;

function playSfx(audioEl){
  if(audioMuted || !audioUnlocked) return;
  try{ audioEl.currentTime = 0; const p = audioEl.play(); if(p) p.catch(()=>{}); }catch(e){}
}
function unlockAudio(){
  if(audioUnlocked) return; audioUnlocked = true;
  document.getElementById('audioGate').classList.add('hidden');
  document.getElementById('startOverlay').classList.remove('hidden');
  if(!audioMuted){ const p = backsound.play(); if(p) p.catch(()=>{}); }
}
function toggleMute(){
  audioMuted = !audioMuted; document.getElementById('muteBtn').textContent = audioMuted ? '✕' : '♪';
  if(audioMuted){ backsound.pause(); } else if(audioUnlocked){ const p = backsound.play(); if(p) p.catch(()=>{}); }
}
document.getElementById('audioGate').addEventListener('click', unlockAudio, {once:true});

const SHEET_CANDIDATES = ["kgame_sheet.png", "kgame_sheet.webp", "AIRetouch_20260811_080701709.webp"];
const FRAME_W = 419, FRAME_H = 712, COLS = 5, ROWS = 3;
const SHEET_W = FRAME_W * COLS, SHEET_H = FRAME_H * ROWS;

function grid(col, row){ return { x:(col-1)*FRAME_W, y:(row-1)*FRAME_H, w:FRAME_W, h:FRAME_H }; }
const FRAMES = {
  r1c1: grid(1,1), r1c2: grid(2,1), r1c3: grid(3,1), r1c4: grid(4,1), r1c5: grid(5,1),
  r2c1: grid(1,2), r2c2: grid(2,2), r2c3: grid(3,2), r2c4: grid(4,2), r2c5: grid(5,2),
  r3c1: grid(1,3), r3c2: grid(2,3), r3c3: grid(3,3), r3c4: grid(4,3), r3c5: grid(5,3)
};
const POSE_MAP = {
  berdiri_1: "r1c1", berdiri_2: "r1c2", berdiri_3: "r2c3",
  kasur_1: "r1c4", kasur_2: "r2c2", kasur_2b: "r2c4",
  kasur_3a: "r3c4", kasur_3: "r3c5"
};

let sheetFound = null;
function probeSheet(cb){
  if(sheetFound !== null){ cb(sheetFound); return; }
  let idx = 0;
  const tryNext = ()=>{
    if(idx >= SHEET_CANDIDATES.length){ sheetFound = false; cb(false); return; }
    const path = SHEET_CANDIDATES[idx++];
    const img = new Image();
    img.onload = ()=>{ sheetFound = path; cb(path); };
    img.onerror = tryNext; img.src = path;
  };
  tryNext();
}

function setSprite(pose){
  const wrap = document.getElementById('spriteWrap');
  const tag = document.getElementById('poseTag');
  const frameKey = POSE_MAP[pose] || pose;
  tag.textContent = "pose: " + pose;
  wrap.style.opacity = 0;
  setTimeout(()=>{
    probeSheet((path)=>{
      const f = FRAMES[frameKey];
      if(path && f){
        const bgwPct = (SHEET_W / f.w) * 100, bghPct = (SHEET_H / f.h) * 100;
        const bgxPct = (f.x / (SHEET_W - f.w)) * 100 || 0, bgyPct = (f.y / (SHEET_H - f.h)) * 100 || 0;
        wrap.innerHTML = `<div class="sheet-sprite" style="--sheet-url:url('${path}'); --sw:${f.w}; --sh:${f.h}; --bgw:${bgwPct}%; --bgh:${bghPct}%; --bgx:${bgxPct}%; --bgy:${bgyPct}%;"></div>`;
      } else {
        wrap.innerHTML = `<div class="placeholder-sprite">Kayla<br>(${pose})</div>`;
      }
      wrap.style.opacity = 1;
    });
  }, 120);
}

let mood = 50, clockMinutes = 23*60+41, typeTimer = null;
function adjustMood(delta){ mood = Math.max(0, Math.min(100, mood+delta)); document.getElementById('moodFill').style.width = mood + '%'; }
function tickClock(mins){ clockMinutes += mins; const h = Math.floor(clockMinutes/60)%24, m = clockMinutes%60; document.getElementById('clockText').textContent = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }

function typeLine(text, cb){
  const el = document.getElementById('lineText'); el.innerHTML = ''; let i = 0; clearInterval(typeTimer);
  document.getElementById('advanceHint').classList.add('hidden'); document.getElementById('choicesBox').classList.add('hidden');
  typeTimer = setInterval(()=>{
    el.textContent = text.slice(0, i+1); i++;
    if(i>=text.length){ clearInterval(typeTimer); if(cb) cb(); }
  }, 18);
  el.onclick = ()=>{ clearInterval(typeTimer); el.textContent = text; if(cb) cb(); };
}

let currentNode = "s0";
function startGame(){ document.getElementById('startOverlay').classList.add('hidden'); adjustMood(0); renderNode("s0"); }
function restartGame(){
  document.getElementById('endOverlay').classList.add('hidden');
  clockMinutes = 23*60+41; document.getElementById('clockText').textContent = "23:41";
  mood = 50; adjustMood(0); renderNode("s0");
}
function renderNode(id){
  currentNode = id; const node = STORY[id]; if(!node) return;
  if(node.type === "ending") return renderEnding(node);
  setSprite(node.pose);
  playSfx(sfxNotif); if(node.intim) playSfx(sfxIntim);
  const nameEl = document.getElementById('speakerName');
  nameEl.className = 'speaker ' + node.speaker;
  nameEl.textContent = node.speaker === 'kayla' ? 'Kayla' : node.speaker === 'Salman Kintil' ? 'Salman Kintil' : '';
  typeLine(node.text, ()=>{
    if(node.type === "line") document.getElementById('advanceHint').classList.remove('hidden');
    else if(node.type === "choice") renderChoices(node.choices);
  });
  const dlg = document.querySelector('.dialogue');
  dlg.onclick = (e)=>{
    if(e.target.closest('.choice-btn')) return;
    const n = STORY[currentNode];
    if(n.type === "line"){ if(n.tick) tickClock(n.tick); renderNode(n.next); }
  };
}
function renderChoices(choices){
  const box = document.getElementById('choicesBox'); box.innerHTML = ''; box.classList.remove('hidden');
  choices.forEach(c=>{
    const btn = document.createElement('button'); btn.className = 'choice-btn';
    btn.innerHTML = `<span class="tag">${c.tag}</span>${c.label}`;
    btn.onclick = (e)=>{ e.stopPropagation(); if(c.mood) adjustMood(c.mood); tickClock(1); renderNode(c.next); };
    box.appendChild(btn);
  });
}
function renderEnding(node){
  setSprite(node.pose); playSfx(sfxNotif);
  document.getElementById('endBadge').textContent = node.badge;
  document.getElementById('endTitle').textContent = node.title;
  document.getElementById('endText').textContent = node.text;
  document.getElementById('endOverlay').classList.remove('hidden');
}
</script>
